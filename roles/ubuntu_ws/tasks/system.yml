# Keep the hostname set at install time across reboots.
- name: Check for cloud-init config
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg
  register: cloud_config

- name: Preserve hostname under cloud-init
  ansible.builtin.lineinfile:
    path: /etc/cloud/cloud.cfg
    regexp: "^preserve_hostname:"
    line: "preserve_hostname: true"
  when: cloud_config.stat.exists

- name: Turn swap off
  ansible.builtin.command: swapoff -a
  when: ws_disable_swap and ansible_facts.swaptotal_mb > 0
  changed_when: true

# Ubuntu's fstab line is "/swap.img none swap sw 0 0".
- name: Remove swap file from fstab
  ansible.builtin.mount:
    path: none
    src: /swap.img
    fstype: swap
    state: absent
  when: ws_disable_swap

- name: Remove swap file
  ansible.builtin.file:
    path: /swap.img
    state: absent
  when: ws_disable_swap

- name: Raise inotify watch and mmap count limits
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: fs.inotify.max_user_watches, value: "524288" }
    - { name: vm.max_map_count, value: "262144" }

- name: Raise the open-files limit
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-ws-nofile.conf
    mode: "0644"
    content: |
      * soft nofile {{ ws_nofile_limit }}
      * hard nofile {{ ws_nofile_limit }}

- name: Load kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/ws.conf
    mode: "0644"
    content: |
      {% for m in ws_modules %}
      {{ m }}
      {% endfor %}

- name: Load kernel modules now
  ansible.builtin.command: modprobe {{ item }}
  loop: "{{ ws_modules }}"
  changed_when: false

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg

# Signal publishes signal-desktop under xenial for all Ubuntu versions.
- name: Add Signal apt repository
  ansible.builtin.deb822_repository:
    name: signal-desktop
    uris: https://updates.signal.org/desktop/apt
    suites: xenial
    components: main
    architectures: amd64
    signed_by: https://updates.signal.org/desktop/apt/keys.asc

# Before the upgrade task so its update_cache picks up the i386 indexes.
- name: List foreign dpkg architectures
  ansible.builtin.command: dpkg --print-foreign-architectures
  register: foreign_archs
  changed_when: false
  when: ws_i386

- name: Add i386 dpkg architecture
  ansible.builtin.command: dpkg --add-architecture i386
  register: i386_added
  when: ws_i386 and 'i386' not in foreign_archs.stdout_lines

- name: Upgrade installed packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: "yes"
    autoremove: true

- name: Install packages
  ansible.builtin.apt:
    name: "{{ ws_packages }}"
    state: present

- name: Install agent CLI tools
  ansible.builtin.apt:
    name: "{{ ws_agent_packages }}"
    state: present

- name: Install dev toolchains
  ansible.builtin.apt:
    name: "{{ ws_dev_packages }}"
    state: present
  when: ws_install_dev_packages

- name: Install i386 libraries
  ansible.builtin.apt:
    name: "{{ ws_i386_packages }}"
    state: present
  when: ws_i386

# The .deb adds Google's apt source itself, so apt upgrades keep it current.
- name: Check for Google Chrome
  ansible.builtin.stat:
    path: /usr/bin/google-chrome
  register: chrome

- name: Install Google Chrome
  ansible.builtin.apt:
    deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
  when: not chrome.stat.exists

- name: Ensure groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - docker
    - wheel

- name: Add user to groups
  ansible.builtin.user:
    name: "{{ ws_user }}"
    shell: /bin/bash
    groups: adm,sudo,wheel,docker,dialout,plugdev
    append: true

- name: Passwordless sudo for the sudo group
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "%sudo ALL=(ALL) NOPASSWD: ALL"
    validate: visudo -cf %s

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

# Amazon's installer; --system puts it under /usr/local/aws-cli with /usr/local/bin/aws.
- name: Install AWS CLI v2
  ansible.builtin.shell: curl -fsSL https://awscli.amazonaws.com/v2/install.sh | bash -s -- --system
  args:
    creates: /usr/local/bin/aws
  when: ws_install_awscli
